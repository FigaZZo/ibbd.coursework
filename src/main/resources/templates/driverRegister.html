<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Driver Registration</title>
</head>
<body>
<h1>Driver Registration</h1>
<form th:action="@{/driver/register}" method="post" th:object="${driver}">
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" th:field="*{username}" required />
  </div>
  <div>
    <label for="phoneNumber">Phone Number:</label>
    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" required />
  </div>
  <div>
    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required />
  </div>
  <div>
    <label for="workExperience">Work Experience:</label>
    <input type="text" id="workExperience" th:field="*{workExperience}" required />
  </div>
  <div>
    <label for="password">Password:</label>
    <input type="text" id="password" th:field="*{password}" required />
  </div>
  <div>
    <button type="submit">Register</button>
  </div>
</form>
<div th:if="${param.error}">
  Registration failed. Please try again.
</div>
</body>
</html>
